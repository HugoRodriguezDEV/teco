[workspace]
members = [".", "monitor"]
# El vigilante (teco) no comparte dependencias con el monitor: cada binario lleva solo lo suyo.
resolver = "2"

[package]
name = "tecolote"
version = "0.1.0"
edition = "2021"
description = "Teco: guardián de recursos ultraligero. Vigila procesos y solo avisa cuando algo se pasa de la raya."
license = "MIT"
rust-version = "1.80"

[[bin]]
name = "teco"
path = "src/main.rs"

[features]
default = []
# POST JSON a una URL cuando se dispara una regla (Telegram, ntfy, ...).
webhook = ["dep:ureq"]

[dependencies]
sysinfo = { version = "0.40", default-features = false, features = ["system", "gpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
notify-rust = { version = "4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
# Si subes otro commit mientras corre, cancela la corrida vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo clippy --release --all-features -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - name: Bench (presupuesto)
        run: cargo run --release -- bench --secs 20 --config ci-teco.toml
      - uses: actions/upload-artifact@v5
        with:
          name: teco-${{ matrix.os }}
          path: |
            target/release/teco
            target/release/teco.exe

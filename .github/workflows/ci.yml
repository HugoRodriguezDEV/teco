name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
# Si subes otro commit mientras corre, cancela la corrida vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo clippy --release --all-features -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - name: Bench (presupuesto)
        run: cargo run --release -- bench --secs 20 --config ci-teco.toml
      # Teco Monitor (barra de menú / bandeja): solo macOS y Windows.
      - name: Monitor
        if: runner.os != 'Linux'
        run: |
          cargo clippy -p teco-monitor --release -- -D warnings
          cargo build -p teco-monitor --release
      - name: Teco.app
        if: runner.os == 'macOS'
        run: monitor/macos/bundle.sh dist
      - uses: actions/upload-artifact@v5
        with:
          name: teco-${{ matrix.os }}
          path: |
            target/release/teco
            target/release/teco.exe
            target/release/teco-monitor.exe
            dist/Teco-macos-arm64.zip

  # Publica los binarios en el Release "teco-latest" (descargables sin sesión de GitHub),
  # solo desde la rama principal del repo.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with: { path: dist }
      - name: Preparar archivos
        run: |
          set -euo pipefail
          mkdir -p out
          # La ruta dentro de cada artifact depende de qué archivos subió: se buscan por nombre.
          pick() { f="$(find "dist/$1" -type f -name "$2" | head -1)"; [ -n "$f" ] || { echo "falta $2 en $1"; exit 1; }; cp "$f" "out/$3"; }
          pick teco-windows-latest teco.exe              teco-windows-x64.exe
          pick teco-windows-latest teco-monitor.exe      teco-monitor-windows-x64.exe
          pick teco-macos-latest   teco                  teco-macos-arm64
          pick teco-macos-latest   Teco-macos-arm64.zip  Teco-macos-arm64.zip
          pick teco-ubuntu-latest  teco                  teco-linux-x64
          chmod +x out/teco-macos-arm64 out/teco-linux-x64
          cd out && for f in *; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done && ls -la
      - name: Publicar teco-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete teco-latest --yes --cleanup-tag || true
          gh release create teco-latest out/* --prerelease --target "$GITHUB_SHA" \
            --title "Teco (último build)" \
            --notes "Build automático de ${GITHUB_SHA::7}. Lo usan deploy/install.ps1 y deploy/install.sh."
